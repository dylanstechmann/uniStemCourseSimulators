# Example; complete an operator security/deployment review before public use.
name: uni-stem-course-simulators-production
x-api: &api
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_PASSWORD_FILE: /run/secrets/db-runtime-password
    DB_HOST: db
    DB_NAME: courselab
    DB_USER: courselab_app
    CONTENT_ROOT: /content
    PRIVATE_ASSESSMENTS_ROOT: /run/private-assessments
    COOKIE_SECURE: "true"
    ALLOWED_ORIGINS: https://${COURSELAB_DOMAIN:?Set COURSELAB_DOMAIN}
    RATE_LIMIT: ${COURSELAB_RATE_LIMIT:-120}
    AUTH_RATE_LIMIT: ${COURSELAB_AUTH_RATE_LIMIT:-30}
    VARIANT_TOKEN_SECRET: ${VARIANT_TOKEN_SECRET:?Set a stable random VARIANT_TOKEN_SECRET}
  secrets: [db-runtime-password]
  volumes:
    - type: bind
      source: ${COURSELAB_PRIVATE_ASSESSMENTS_PATH:-/srv/courselab-private-assessments}
      target: /run/private-assessments
      read_only: true
      bind:
        create_host_path: true
  networks: [database, application]
  read_only: true
  tmpfs: [/tmp:size=64m,noexec,nosuid]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: ${COURSELAB_API_MEMORY_LIMIT:-1g}
  cpus: ${COURSELAB_API_CPUS:-1.0}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courselab
      POSTGRES_USER: courselab
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets: [db-password]
    volumes: [database:/var/lib/postgresql/data]
    networks: [database]
    mem_limit: ${COURSELAB_DB_MEMORY_LIMIT:-2g}
    cpus: ${COURSELAB_DB_CPUS:-2.0}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U courselab -d courselab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db-roles:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/provision-runtime-role.sh"]
    user: "10001:10001"
    environment:
      DB_HOST: db
      DB_NAME: courselab
      DB_ADMIN_USER: courselab
      DB_RUNTIME_USER: courselab_app
      DB_ADMIN_PASSWORD_FILE: /run/secrets/db-password
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db-runtime-password
    secrets: [db-password, db-runtime-password]
    volumes:
      - ./deploy/provision-runtime-role.sh:/provision-runtime-role.sh:ro
      - ./deploy/provision-runtime-role.sql:/provision-runtime-role.sql:ro
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    mem_limit: 256m
    cpus: 0.25
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/db-password
      DB_HOST: db
      DB_NAME: courselab
      DB_USER: courselab
      CONTENT_ROOT: /content
      PRIVATE_ASSESSMENTS_ROOT: /run/private-assessments
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${COURSELAB_DOMAIN:?Set COURSELAB_DOMAIN}
      VARIANT_TOKEN_SECRET: ${VARIANT_TOKEN_SECRET:?Set a stable random VARIANT_TOKEN_SECRET}
    secrets: [db-password]
    mem_limit: ${COURSELAB_MIGRATE_MEMORY_LIMIT:-2g}
    cpus: ${COURSELAB_MIGRATE_CPUS:-1.0}
    depends_on:
      db-roles: {condition: service_completed_successfully}
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: ./frontend
    networks: [application]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      COURSELAB_DOMAIN: ${COURSELAB_DOMAIN:?Set COURSELAB_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [application]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
networks:
  database: {internal: true}
  application: {}
volumes:
  database: {}
  caddy-data: {}
  caddy-config: {}
secrets:
  db-password:
    file: ${DB_PASSWORD_FILE:?Set DB_PASSWORD_FILE to untracked secret}
  db-runtime-password:
    file: ${DB_RUNTIME_PASSWORD_FILE:?Set DB_RUNTIME_PASSWORD_FILE to untracked runtime secret}
